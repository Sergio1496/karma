name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: karma-cli
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: karma-cli
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: karma-cli
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: karma-cli
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: karma-cli.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ../../../karma-cli-${{ matrix.target }}.zip ${{ matrix.artifact }}
          else
            tar czf ../../../karma-cli-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: karma-cli-${{ matrix.target }}
          path: karma-cli-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            karma-cli-*/karma-cli-*.tar.gz
            karma-cli-*/karma-cli-*.zip
