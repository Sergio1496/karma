[package]
name = "karma"
version = "0.1.0"
edition = "2021"
description = "CLI tool to configure Claude Code with skills, orchestrators, sub-agents, MCP servers, and hooks"
license = "MIT"
repository = "https://github.com/Sergio1496/karma"
readme = "README.md"
keywords = ["claude-code", "cli", "developer-tools", "ai"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "karma"
path = "src/lib.rs"

[[bin]]
name = "karma"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async + HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

# Filesystem
dirs = "6"
tempfile = "3"

# Embedded assets
rust-embed = "8"

# Error handling
anyhow = "1"
thiserror = "2"

# Misc
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

# cargo-dist configuration
# To set up: cargo install cargo-dist && cargo dist init
# Then run: cargo dist build
# For release: git tag v0.1.0 && git push --tags
# GitHub Actions will build and create a release with binaries + Homebrew formula
